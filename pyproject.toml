[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fortuneforge"
version = "1.0.0"
description = "Offline multilingual fortune-cookie generator with printable PDF output."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "reportlab>=4.2,<5",
]


[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]


[project.scripts]
fortuneforge = "fortuneforge.app:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
target-version = "py312"
line-length = 100


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]